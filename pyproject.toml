[project]
name = "py_libs"
version = "0.1.0"
description = "Shared CLI utility classes (Select, Command, Menu, Print, ...) reused across projects"
requires-python = ">=3.10,<4.0"
dependencies = [
    "rich>=13.9.4",
    "questionary>=2.1.0",
    "simple-term-menu>=1.6.6",
    "pyperclip>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_libs"]
